name: release

# A version tag builds the records package (Architecture: all, from debian/), lints it, proves it installs
# in Debian trixie on arm64 beside plugin-qualify from the channel and that plugin-qualify-sync --system takes
# plugins from it, then signs it and publishes it into the deb/ tree of the FreeMixer Pages repository, and
# attaches it to the GitHub release. A manual run builds and proves the same and publishes nothing unless
# `publish` is set, and even then only on a tag. The build and the publish are in FreeMixer/.github; the
# secrets (OPENMIXER_PACKAGES_SIGNING_KEY, PAGES_TOKEN) are the organisation's.
#
# A tagged commit that carries debian/republish does not build: it takes a package the channel already holds,
# repacks it under the version debian/changelog names (dpkg-deb -R, the Version field, dpkg-deb -b; every file it
# installs byte for byte the same, which the job checks), and publishes that through the same publish step. It
# renames a published set without measuring or building it again. The file says, one per line:
#   from <version>          the version the channel holds
#   at <channel commit>     the commit of FreeMixer/freemixer.github.io that holds it (the tree is read there)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Sign and publish; only a run on a tag publishes'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  plan:
    name: Build or republish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      from: ${{ steps.read.outputs.from }}
      at: ${{ steps.read.outputs.at }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          set -euo pipefail
          if [ -f debian/republish ]; then
            from=$(awk '$1 == "from" {print $2}' debian/republish)
            at=$(awk '$1 == "at" {print $2}' debian/republish)
            [ -n "$from" ] && [ -n "$at" ] || { echo "::error::debian/republish needs a from and an at line"; exit 1; }
            echo "from=$from" >> "$GITHUB_OUTPUT"
            echo "at=$at" >> "$GITHUB_OUTPUT"
            echo "republish $from (channel $at)"
          else
            echo "build from debian/"
          fi

  deb:
    needs: plan
    if: needs.plan.outputs.from == ''
    uses: FreeMixer/.github/.github/workflows/build-deb.yml@v1
    with:
      # the source package is named for the repository, which keeps the .changes file name short for lintian
      package-name: omx-qualification-records
      binary-names: omx-qualification-rpi5-zynthian-vangelis
      publish: ${{ github.event_name == 'push' || inputs.publish == true }}
      # the records are data for plugin-qualify on a Raspberry Pi 5 running Debian trixie (Zynthian's base):
      # no build dependency beyond debhelper, and one package for all architectures
      dependencies: ''
      requires: ''
      channel-deps: false
      # the changelog is regenerated from git by a python3 script
      build-packages: python3
      suite-matrix: '["trixie"]'
      arch-matrix: '["amd64"]'
    secrets: inherit

  # The package installed where it is used: arm64 Debian trixie with plugin-qualify from the channel and Debian's
  # own lv2vocoder, whose bytes are the ones the Zynthian image holds (checked against the records' SHA-256s; the
  # image's other Debian plugins have since been rebuilt, so their records rightly do not apply). The sync takes it
  # from the records and measures nothing. If Debian rebuilds lv2vocoder this step fails with `binary differs`: pick
  # another plugin whose installed files still hash as a record's.
  # The republish: the channel's package under this commit's version, every installed file unchanged.
  repack:
    name: Repack ${{ needs.plan.outputs.from }} under this version
    needs: plan
    if: needs.plan.outputs.from != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: debian:trixie
    env:
      FROM: ${{ needs.plan.outputs.from }}
      AT: ${{ needs.plan.outputs.at }}
      PKG: omx-qualification-rpi5-zynthian-vangelis
    steps:
      - uses: actions/checkout@v4
      - name: Repack
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl dpkg-dev
          to=$(dpkg-parsechangelog -S Version)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$to" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$to (debian/changelog)"; exit 1; }
          fi
          dpkg --compare-versions "$to" gt "$FROM" || { echo "::error::$to does not sort above $FROM"; exit 1; }
          old=${PKG}_${FROM}_all.deb
          curl -fsSL -o "$old" "https://raw.githubusercontent.com/FreeMixer/freemixer.github.io/$AT/deb/debian/trixie/all/$old"
          [ "$(dpkg-deb -f "$old" Package)" = "$PKG" ] && [ "$(dpkg-deb -f "$old" Version)" = "$FROM" ]
          dpkg-deb -R "$old" pkg
          sed -i "s/^Version: .*/Version: $to/" pkg/DEBIAN/control
          mkdir -p out/trixie
          new=out/trixie/${PKG}_${to}_all.deb
          dpkg-deb -b --root-owner-group pkg "$new"
          # the files it installs, byte for byte, and their modes: the same set under another version
          inv() { dpkg-deb --fsys-tarfile "$1" | tar -tv --numeric-owner | awk '{print $1, $3, $6}' | sort; }
          cmp <(inv "$old") <(inv "$new") || { echo "::error::the repacked listing differs"; exit 1; }
          sums() { local d; d=$(mktemp -d); dpkg-deb -x "$1" "$d"; (cd "$d" && find . -type f -exec sha256sum {} + | sort -k2); }
          cmp <(sums "$old") <(sums "$new") || { echo "::error::the repacked contents differ"; exit 1; }
          echo "$old -> $(basename "$new"): $(sums "$new" | wc -l) files unchanged"
          dpkg-deb -I "$new" | sed -n '/Package:/,$p'
      - uses: actions/upload-artifact@v4
        with:
          name: omx-qualification-records-debs-trixie-amd64
          path: out
          if-no-files-found: error
          retention-days: 30

  publish-repacked:
    name: Sign and publish the repacked package
    needs: repack
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:trixie
    concurrency:
      group: publish-FreeMixer/freemixer.github.io-live
      cancel-in-progress: false
    steps:
      - uses: FreeMixer/.github/.github/actions/release-preflight@v1
        with:
          publish: true
          tag: ${{ github.ref_name }}
          target: FreeMixer/freemixer.github.io
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          pages-token: ${{ secrets.PAGES_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: omx-qualification-records-debs-*
          merge-multiple: true
          path: collected
      - uses: FreeMixer/.github/.github/actions/publish-debs@v1
        with:
          deb-dir: collected
          tag: ${{ github.ref_name }}
          sign: true
          gpg-key: ${{ secrets.OPENMIXER_PACKAGES_SIGNING_KEY }}
          cosign-key: ${{ secrets.RPM_GPG_KEY }}
          cosign-passphrase: ${{ secrets.RPM_GPG_PASSPHRASE }}
          publish-token: ${{ secrets.PAGES_TOKEN }}
          site-gpg-key: ${{ secrets.SITE_GPG_KEY }}
          channel: FreeMixer/freemixer.github.io
          requires: ''
          changelogs-url: https://www.openmixer.org/deb/changelogs
      - uses: actions/upload-artifact@v4
        with:
          name: omx-qualification-records-debs-signed
          path: signed/*.deb
          if-no-files-found: error
          retention-days: 30

  release-repacked:
    name: GitHub release of the repacked package
    needs: [plan, publish-repacked]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omx-qualification-records-debs-signed
          path: signed
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FROM: ${{ needs.plan.outputs.from }}
        run: |
          set -euo pipefail
          for deb in signed/*.deb; do base=$(basename "$deb" .deb); cp "$deb" "${base%_*}_trixie_${base##*_}.deb"; done
          gh release create "$TAG" ./*_trixie_*.deb --title "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "The records of v${FROM#v}, unchanged, under the version $TAG names."

  installed:
    name: Install and sync (trixie, arm64)
    needs: [deb, repack]
    if: ${{ !cancelled() && (needs.deb.result == 'success' || needs.repack.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: omx-qualification-records-debs-trixie-amd64
          path: pkgs

      - name: Prepare the container
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl

      - uses: FreeMixer/.github/.github/actions/add-openmixer@v1

      - name: Install the package
        run: |
          set -euo pipefail
          chmod -R a+rX pkgs
          apt-get install -y --no-install-recommends ./pkgs/trixie/omx-qualification-rpi5-zynthian-vangelis_*_all.deb lv2vocoder
          have=$(dpkg-query -W -f '${Version}' plugin-qualify)
          echo "plugin-qualify $have"
          dpkg --compare-versions "$have" ge 0.17.0
          test -f /usr/share/omx/qualification/rpi5/zynthian-vangelis/provenance.json
          n=$(ls /usr/share/omx/qualification/rpi5/zynthian-vangelis/*.qualification.json | wc -l)
          echo "$n records installed"
          [ "$n" -eq "$(ls records/rpi5/zynthian-vangelis/*.qualification.json | wc -l)" ]

      # a container has no device tree, so the host class is the settings file's; no plugin-hostd listens
      - name: plugin-qualify-sync --system applies the records
        run: |
          set -euo pipefail
          mkdir -p /etc/omx
          printf 'host_class rpi5\nlv2_extra\nhostd_port 0\n' > /etc/omx/qualify.conf
          plugin-qualify-sync --system 2>&1 | tee sync.log
          applied=$(grep -c 'distributed: .*: applied' sync.log || true)
          echo "applied: $applied"
          [ "$applied" -gt 0 ] || { echo "::error::no plugin was taken from the records"; exit 1; }
          if grep -E 'distributed: .*(binary differs|not applied|measured here)' sync.log; then
            echo "::error::a plugin of the set was measured instead of taken from the records"; exit 1
          fi
          ls /var/lib/omx/qualification/*.qualification.json | wc -l
